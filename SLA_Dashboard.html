<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendEase SLA Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    padding: 24px;
  }
  .page { max-width: 1400px; margin: 0 auto; }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #262a35;
  }
  .header .title { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; color: #8b91a3; margin-top: 3px; }
  .header .stats { display: flex; gap: 22px; }
  .header .stat { text-align: right; }
  .header .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .header .stat .l { font-size: 11px; color: #8b91a3; margin-top: 2px; }
  .stat.alert .n { color: #f0595a; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: #171a23;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card.has-alerts { border-left: 3px solid #f0595a; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-head .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .badge.bad { background: #3a1c1e; color: #f0595a; }
  .badge.ok { background: #163524; color: #4ade80; }
  .col-head {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    gap: 6px;
    padding: 0 0 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #5b6072;
  }
  .col-head span:not(:first-child) { text-align: right; }
  .row {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    font-size: 12.5px;
    border-top: 1px solid #21242e;
  }
  .row:first-of-type { border-top: none; }
  .loc { white-space: normal; word-break: normal; line-height: 1.3; padding-right: 4px; display: block; }
  .serial { display: block; font-size: 10px; color: #5b6072; margin-top: 1px; font-family: monospace; }
  .pill { text-align: right; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; justify-self: end; }
  .pill.danger { background: #3a1c1e; color: #f0595a; }
  .pill.warning { background: #3a2e14; color: #eab308; }
  .pill.ok { background: #163524; color: #4ade80; }
  .all-clear { display: flex; align-items: center; gap: 5px; padding: 5px 0; font-size: 12.5px; color: #4ade80; }
  .footer { margin-top: 16px; font-size: 11px; color: #5b6072; text-align: right; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">VendEase SLA dashboard</div>
      <div class="subtitle" id="hdr-date"></div>
    </div>
    <div class="stats">
      <div class="stat alert"><div class="n" id="hdr-alerts"></div><div class="l">in alert</div></div>
      <div class="stat"><div class="n" id="hdr-machines"></div><div class="l">machines</div></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
const DATA = {"date":"2026-07-30","run_date":"2026-07-30","partners":{"Abercromby Vending":{"total":79,"alerts":[{"serial":"SVM0000294","partner":"Abercromby Vending","location":"Premier Inn Falkirk East","region":"Premier Inn Falkirk East","water_pct":0.0,"water_avail":0,"water_cap":40,"snack_pct":0.0,"snack_avail":0,"snack_cap":244,"online":"No"},{"serial":"SVM0000296","partner":"Abercromby Vending","location":"Premier Inn Milngavie","region":"Premier Inn Milngavie","water_pct":0.0,"water_avail":0,"water_cap":40,"snack_pct":43.2,"snack_avail":112,"snack_cap":259,"online":"No"},{"serial":"SVM0000267","partner":"Abercromby Vending","location":"Premier Inn Inverness West","region":"Premier Inn Inverness West","water_pct":2.5,"water_avail":1,"water_cap":40,"snack_pct":48.3,"snack_avail":125,"snack_cap":259,"online":"No"}]},"VendEase Premier Inn":{"total":205,"alerts":[{"serial":"IVM0004555","partner":"VendEase Premier Inn","location":"Premier Inn London Wembley Park","region":"Premier Inn London Wembley Park","water_pct":38.0,"water_avail":19,"water_cap":50,"snack_pct":7.1,"snack_avail":18,"snack_cap":254,"online":"Yes"},{"serial":"IVM0006255","partner":"VendEase Premier Inn","location":"Premier Inn Portsmouth Dockyard","region":"Premier Inn Portsmouth Dockyard","water_pct":0.0,"water_avail":0,"water_cap":50,"snack_pct":44.1,"snack_avail":105,"snack_cap":238,"online":"Yes"},{"serial":"IVM0006985","partner":"VendEase Premier Inn","location":"Premier Inn London Stansted Airport","region":"Premier Inn London Stansted Airport","water_pct":80.0,"water_avail":40,"water_cap":50,"snack_pct":11.2,"snack_avail":28,"snack_cap":250,"online":"Yes"},{"serial":"SVM0000192","partner":"VendEase Premier Inn","location":"Premier Inn Gatwick Airport (North Terminal)","region":"Premier Inn Gatwick Airport (North Terminal)","water_pct":52.0,"water_avail":26,"water_cap":50,"snack_pct":10.6,"snack_avail":27,"snack_cap":254,"online":"Yes"},{"serial":"SVM0000137","partner":"VendEase Premier Inn","location":"Premier Inn London Southwark (Bankside)","region":"Premier Inn London Southwark (Bankside)","water_pct":10.0,"water_avail":5,"water_cap":50,"snack_pct":49.6,"snack_avail":126,"snack_cap":254,"online":"Yes"},{"serial":"SVM0000458","partner":"VendEase Premier Inn","location":"Premier Inn Heathrow Airport Terminal 5","region":"Premier Inn Heathrow Airport Terminal 5","water_pct":56.0,"water_avail":28,"water_cap":50,"snack_pct":11.0,"snack_avail":28,"snack_cap":254,"online":"Yes"}]},"WLV":{"total":181,"alerts":[{"serial":"IVM0006229","partner":"WLV","location":"Premier Inn Manchester Airport (M56/J6) Runger Lane South ","region":"Premier Inn Manchester Airport (M56/J6) Runger Lane South ","water_pct":7.5,"water_avail":3,"water_cap":40,"snack_pct":29.0,"snack_avail":69,"snack_cap":238,"online":"Yes"},{"serial":"SVM0000248","partner":"WLV","location":"Premier Inn Manchester (Swinton) ","region":"Premier Inn Manchester (Swinton) ","water_pct":47.5,"water_avail":19,"water_cap":40,"snack_pct":4.0,"snack_avail":9,"snack_cap":223,"online":"Yes"},{"serial":"SVM0000398","partner":"WLV","location":"Premier Inn Liverpool (West Derby) ","region":"Premier Inn Liverpool (West Derby) ","water_pct":0.0,"water_avail":0,"water_cap":40,"snack_pct":48.7,"snack_avail":116,"snack_cap":238,"online":"Yes"}]},"VendEase Travelodge":{"total":31,"alerts":[]},"JW Vending":{"total":47,"alerts":[{"serial":"SVM0000858","partner":"JW Vending","location":"Premier Inn Frome","region":"Premier Inn Frome","water_pct":0.0,"water_avail":0,"water_cap":40,"snack_pct":47.6,"snack_avail":121,"snack_cap":254,"online":"Yes"}]},"V4 Vending":{"total":1,"alerts":[]},"Wilkes Vending":{"total":9,"alerts":[]}},"tracking":{"SVM0000296":"2026-07-05","SVM0000294":"2026-06-13","IVM0004555":"2026-07-29","SVM0000192":"2026-07-29","SVM0000858":"2026-07-27","SVM0000248":"2026-07-14","SVM0000267":"2026-07-29","SVM0000398":"2026-07-29","IVM0006229":"2026-07-30","IVM0006255":"2026-07-30","IVM0006985":"2026-07-30","SVM0000137":"2026-07-30","SVM0000458":"2026-07-30"}};

const KNOWN_ORDER = ['Abercromby Vending', 'VendEase Premier Inn', 'VendEase Travelodge', 'WLV', 'JW Vending', 'V4 Vending', 'Wilkes Vending'];
const ICONS = {
  'Abercromby Vending': '&#127970;',
  'VendEase Premier Inn': '&#128716;',
  'VendEase Travelodge': '&#128717;',
  'WLV': '&#127981;',
  'JW Vending': '&#127981;',
  'V4 Vending': '&#127981;',
  'Wilkes Vending': '&#127981;',
  'Unknown': '&#10067;'
};
const PARTNERS = [...KNOWN_ORDER, ...Object.keys(DATA.partners).filter(p => !KNOWN_ORDER.includes(p))];

function pillClass(pct) {
  if (pct === null || pct === undefined) return 'ok';
  if (pct <= 10) return 'danger';
  if (pct <= 24) return 'warning';
  return 'ok';
}

function pill(pct) {
  if (pct === null || pct === undefined) return '<span></span>';
  const c = pillClass(pct);
  return `<span class="pill ${c}">${pct.toFixed(0)}%</span>`;
}

function daysSince(ds) {
  const ref = new Date(DATA.run_date || DATA.date);
  return Math.max(1, Math.round((ref - new Date(ds)) / 86400000) + 1);
}

function onlinePill(online) {
  if (online === undefined || online === null) return '<span></span>';
  const isOnline = online === 'Yes' || online === true;
  return `<span class="pill ${isOnline ? 'ok' : 'danger'}">${isOnline ? 'Yes' : 'No'}</span>`;
}

const runD = new Date(DATA.run_date || DATA.date);
document.getElementById('hdr-date').textContent = runD.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (DATA.data_note ? ' — ⚠️ ' + DATA.data_note : '');

let totalAlerts = 0, totalMachines = 0;
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  totalMachines += pd.total || 0;
  totalAlerts += pd.alerts.length;
});
document.getElementById('hdr-alerts').textContent = totalAlerts;
document.getElementById('hdr-machines').textContent = totalMachines;

let html = '';
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  const alerts = pd.alerts;
  const hasAlerts = alerts.length > 0;
  const icon = ICONS[p] || '&#127970;';
  html += `<div class="card ${hasAlerts ? 'has-alerts' : ''}">
    <div class="card-head">
      <span class="name"><span>${icon}</span>${p}</span>
      <span class="badge ${hasAlerts ? 'bad' : 'ok'}">${alerts.length}/${pd.total}</span>
    </div>`;
  if (!hasAlerts) {
    html += `<div class="all-clear">&#10003; All clear</div>`;
  } else {
    html += `<div class="col-head"><span>Location</span><span>Water</span><span>Snack</span><span>Days</span><span>Online</span></div>`;
    alerts.forEach(a => {
      const days = DATA.tracking[a.serial] ? daysSince(DATA.tracking[a.serial]) : 1;
      const dayTag = days > 1 ? `<span class="pill ok">${days}d</span>` : '<span></span>';
      html += `<div class="row">
        <span class="loc">${a.location}<span class="serial">${a.serial}</span></span>
        ${pill(a.water_pct)}
        ${pill(a.snack_pct)}
        ${dayTag}
        ${onlinePill(a.online)}
      </div>`;
    });
  }
  html += `</div>`;
});
document.getElementById('grid').innerHTML = html;
document.getElementById('footer').textContent = 'Water = Radnor/Strathmore stock · Snacks = chocolate/crisps/bars stock · Alert threshold 15%';
</script>
</body>
</html>
