<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendEase SLA Dashboard</title>
<style>
  html {
    scroll-behavior: smooth;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    padding: 24px;
  }
  .page { max-width: 1400px; margin: 0 auto; }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #262a35;
  }
  .header .title { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; color: #8b91a3; margin-top: 3px; }
  .header .stats { display: flex; gap: 22px; }
  .header .stat { text-align: right; }
  .header .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .header .stat .l { font-size: 11px; color: #8b91a3; margin-top: 2px; }
  .stat.alert .n { color: #f0595a; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: #171a23;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card.has-alerts { border-left: 3px solid #f0595a; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-head .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .badge.bad { background: #3a1c1e; color: #f0595a; }
  .badge.ok { background: #163524; color: #4ade80; }
  .col-head {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    gap: 6px;
    padding: 0 0 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #5b6072;
  }
  .col-head span:not(:first-child) { text-align: right; }
  .row {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    font-size: 12.5px;
    border-top: 1px solid #21242e;
  }
  .row:first-of-type { border-top: none; }
  .loc { white-space: normal; word-break: normal; line-height: 1.3; padding-right: 4px; display: block; }
  .serial { display: block; font-size: 10px; color: #5b6072; margin-top: 1px; font-family: monospace; }
  .pill { text-align: right; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; justify-self: end; }
  .pill.danger { background: #3a1c1e; color: #f0595a; }
  .pill.warning { background: #3a2e14; color: #eab308; }
  .pill.ok { background: #163524; color: #4ade80; }
  .all-clear { display: flex; align-items: center; gap: 5px; padding: 5px 0; font-size: 12.5px; color: #4ade80; }
  .footer { margin-top: 16px; font-size: 11px; color: #5b6072; text-align: right; }
  .footer .push-time { margin-top: 3px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">VendEase SLA dashboard</div>
      <div class="subtitle" id="hdr-date"></div>
    </div>
    <div class="stats">
      <div class="stat alert"><div class="n" id="hdr-alerts"></div><div class="l">in alert</div></div>
      <div class="stat"><div class="n" id="hdr-machines"></div><div class="l">machines</div></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <div id="footer"></div>
    <div class="push-time" id="footer-push"></div>
  </div>
</div>

<script>
const DATA = {"date": "2026-08-05", "run_date": "2026-08-05", "run_timestamp": "2026-08-05 12:13 BST", "partners": {"Abercromby Vending": {"total": 79, "alerts": [{"serial": "SVM0000296", "partner": "Abercromby Vending", "location": "Premier Inn Milngavie", "water_pct": 0.0, "water_avail": 0, "water_cap": 40, "snack_pct": 43.2, "snack_avail": 112, "snack_cap": 259, "online": "No"}, {"serial": "IVM0006295", "partner": "Abercromby Vending", "location": "Premier Inn Inverness Centre Riverness", "water_pct": 0.0, "water_avail": 0, "water_cap": 40, "snack_pct": 60.6, "snack_avail": 157, "snack_cap": 259, "online": "Yes"}, {"serial": "SVM0000294", "partner": "Abercromby Vending", "location": "Premier Inn Falkirk East", "water_pct": 0.0, "water_avail": 0, "water_cap": 40, "snack_pct": 0.0, "snack_avail": 0, "snack_cap": 244, "online": "No"}]}, "VendEase Premier Inn": {"total": 205, "alerts": [{"serial": "SVM0000359", "partner": "VendEase Premier Inn", "location": "Premier Inn London Enfield", "water_pct": 14.0, "water_avail": 7, "water_cap": 50, "snack_pct": 65.1, "snack_avail": 155, "snack_cap": 238, "online": "Yes"}, {"serial": "IVM0006463", "partner": "VendEase Premier Inn", "location": "Premier Inn Braintree (Freeport Village)", "water_pct": 12.0, "water_avail": 6, "water_cap": 50, "snack_pct": 46.2, "snack_avail": 110, "snack_cap": 238, "online": "Yes"}, {"serial": "IVM0006985", "partner": "VendEase Premier Inn", "location": "Premier Inn London Stansted Airport", "water_pct": 50.0, "water_avail": 25, "water_cap": 50, "snack_pct": 8.8, "snack_avail": 22, "snack_cap": 250, "online": "Yes"}, {"serial": "IVM0006494", "partner": "VendEase Premier Inn", "location": "Premier Inn Gatwick Airport South (London Road)", "water_pct": 78.0, "water_avail": 39, "water_cap": 50, "snack_pct": 9.4, "snack_avail": 24, "snack_cap": 254, "online": "Yes"}, {"serial": "SVM0000167", "partner": "VendEase Premier Inn", "location": "Premier Inn Faversham", "water_pct": 90.0, "water_avail": 45, "water_cap": 50, "snack_pct": 14.2, "snack_avail": 36, "snack_cap": 254, "online": "Yes"}, {"serial": "SVM0000322", "partner": "VendEase Premier Inn", "location": "Premier Inn London St Pancras", "water_pct": 52.0, "water_avail": 26, "water_cap": 50, "snack_pct": 8.7, "snack_avail": 22, "snack_cap": 254, "online": "Yes"}]}, "VendEase Travelodge": {"total": 31, "alerts": []}, "WLV": {"total": 181, "alerts": []}, "JW Vending": {"total": 58, "alerts": [{"serial": "SVM0000812", "partner": "JW Vending", "location": "Premier WSM Lympsham", "water_pct": 2.0, "water_avail": 1, "water_cap": 50, "snack_pct": 76.8, "snack_avail": 195, "snack_cap": 254, "online": "No"}, {"serial": "IVM0007864", "partner": "JW Vending", "location": "Premier Inn Swindon Town Center", "water_pct": 7.5, "water_avail": 3, "water_cap": 40, "snack_pct": 61.4, "snack_avail": 156, "snack_cap": 254, "online": "Yes"}, {"serial": "SVM0000853", "partner": "JW Vending", "location": "Premier WSM SEA", "water_pct": 10.0, "water_avail": 5, "water_cap": 50, "snack_pct": 76.0, "snack_avail": 193, "snack_cap": 254, "online": "Yes"}, {"serial": "SVM0000835", "partner": "JW Vending", "location": "Premier WSM SEA", "water_pct": 0.0, "water_avail": 0, "water_cap": 50, "snack_pct": 59.1, "snack_avail": 150, "snack_cap": 254, "online": "Yes"}, {"serial": "SVM0000860", "partner": "JW Vending", "location": "Premier Inn Taunton East", "water_pct": 4.0, "water_avail": 2, "water_cap": 50, "snack_pct": 64.2, "snack_avail": 163, "snack_cap": 254, "online": "No"}]}, "V4 Vending": {"total": 1, "alerts": []}, "Wilkes Vending": {"total": 22, "alerts": [{"serial": "SVM0000787", "partner": "Wilkes Vending", "location": "Premier Inn York North West", "water_pct": 0.0, "water_avail": 0, "water_cap": 50, "snack_pct": 41.7, "snack_avail": 106, "snack_cap": 254, "online": "Yes"}]}}, "tracking": {"IVM0007864": "2026-08-04", "IVM0006463": "2026-08-05", "SVM0000860": "2026-08-04", "SVM0000322": "2026-08-04", "SVM0000296": "2026-07-05", "IVM0006295": "2026-08-04", "IVM0006494": "2026-08-04", "SVM0000835": "2026-08-03", "SVM0000812": "2026-08-05", "SVM0000359": "2026-08-05", "SVM0000787": "2026-08-03", "SVM0000167": "2026-08-04", "IVM0006985": "2026-08-05", "SVM0000294": "2026-06-13", "SVM0000853": "2026-08-05"}, "last_github_push": "2026-08-05 12:14 BST"};
const KNOWN_ORDER = ['Abercromby Vending', 'VendEase Premier Inn', 'VendEase Travelodge', 'WLV', 'JW Vending', 'V4 Vending', 'Wilkes Vending'];
const ICONS = {
  'Abercromby Vending': '&#127970;',
  'VendEase Premier Inn': '&#128716;',
  'VendEase Travelodge': '&#128717;',
  'WLV': '&#127981;',
  'JW Vending': '&#127981;',
  'V4 Vending': '&#127981;',
  'Wilkes Vending': '&#127981;',
  'Unknown': '&#10067;'
};
const PARTNERS = [...KNOWN_ORDER, ...Object.keys(DATA.partners).filter(p => !KNOWN_ORDER.includes(p))];

function pillClass(pct) {
  if (pct === null || pct === undefined) return 'ok';
  if (pct <= 10) return 'danger';
  if (pct <= 24) return 'warning';
  return 'ok';
}

function pill(pct) {
  if (pct === null || pct === undefined) return '<span></span>';
  const c = pillClass(pct);
  return `<span class="pill ${c}">${pct.toFixed(0)}%</span>`;
}

function daysSince(ds) {
  const ref = new Date(DATA.run_date || DATA.date);
  return Math.max(1, Math.round((ref - new Date(ds)) / 86400000) + 1);
}

function onlinePill(online) {
  if (online === undefined || online === null) return '<span></span>';
  const isOnline = online === 'Yes' || online === true;
  return `<span class="pill ${isOnline ? 'ok' : 'danger'}">${isOnline ? 'Yes' : 'No'}</span>`;
}

const runD = new Date(DATA.run_date || DATA.date);
document.getElementById('hdr-date').textContent = runD.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (DATA.data_note ? ' — ⚠️ ' + DATA.data_note : '');

let totalAlerts = 0, totalMachines = 0;
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  totalMachines += pd.total || 0;
  totalAlerts += pd.alerts.length;
});
document.getElementById('hdr-alerts').textContent = totalAlerts;
document.getElementById('hdr-machines').textContent = totalMachines;

let html = '';
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  const alerts = pd.alerts;
  const hasAlerts = alerts.length > 0;
  const icon = ICONS[p] || '&#127970;';
  html += `<div class="card ${hasAlerts ? 'has-alerts' : ''}">
    <div class="card-head">
      <span class="name"><span>${icon}</span>${p}</span>
      <span class="badge ${hasAlerts ? 'bad' : 'ok'}">${alerts.length}/${pd.total}</span>
    </div>`;
  if (!hasAlerts) {
    html += `<div class="all-clear">&#10003; All clear</div>`;
  } else {
    html += `<div class="col-head"><span>Location</span><span>Water</span><span>Snack</span><span>Days</span><span>Online</span></div>`;
    alerts.forEach(a => {
      const days = DATA.tracking[a.serial] ? daysSince(DATA.tracking[a.serial]) : 1;
      const dayTag = days > 1 ? `<span class="pill ok">${days}d</span>` : '<span></span>';
      html += `<div class="row">
        <span class="loc">${a.location}<span class="serial">${a.serial}</span></span>
        ${pill(a.water_pct)}
        ${pill(a.snack_pct)}
        ${dayTag}
        ${onlinePill(a.online)}
      </div>`;
    });
  }
  html += `</div>`;
});
document.getElementById('grid').innerHTML = html;
document.getElementById('footer').textContent = 'Water = Radnor/Strathmore stock · Snacks = chocolate/crisps/bars stock · Alert threshold 15%';
document.getElementById('footer-push').textContent = DATA.last_github_push
  ? 'Last uploaded to GitHub: ' + DATA.last_github_push
  : 'Last uploaded to GitHub: not yet recorded';
</script>
</body>
</html>
