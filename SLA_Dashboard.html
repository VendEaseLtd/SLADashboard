<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendEase SLA Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    padding: 24px;
  }
  .page { max-width: 1400px; margin: 0 auto; }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #262a35;
  }
  .header .title { font-size: 22px; font-weight: 700; }
  .header .subtitle { font-size: 13px; color: #8b91a3; margin-top: 3px; }
  .header .stats { display: flex; gap: 22px; }
  .header .stat { text-align: right; }
  .header .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .header .stat .l { font-size: 11px; color: #8b91a3; margin-top: 2px; }
  .stat.alert .n { color: #f0595a; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }
  .card {
    background: #171a23;
    border: 1px solid #262a35;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card.has-alerts { border-left: 3px solid #f0595a; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-head .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .badge.bad { background: #3a1c1e; color: #f0595a; }
  .badge.ok { background: #163524; color: #4ade80; }
  .col-head {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    gap: 6px;
    padding: 0 0 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #5b6072;
  }
  .col-head span:not(:first-child) { text-align: right; }
  .row {
    display: grid;
    grid-template-columns: 1fr 52px 52px 40px 46px;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
    font-size: 12.5px;
    border-top: 1px solid #21242e;
  }
  .row:first-of-type { border-top: none; }
  .loc { white-space: normal; word-break: normal; line-height: 1.3; padding-right: 4px; display: block; }
  .serial { display: block; font-size: 10px; color: #5b6072; margin-top: 1px; font-family: monospace; }
  .pill { text-align: right; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; justify-self: end; }
  .pill.danger { background: #3a1c1e; color: #f0595a; }
  .pill.warning { background: #3a2e14; color: #eab308; }
  .pill.ok { background: #163524; color: #4ade80; }
  .all-clear { display: flex; align-items: center; gap: 5px; padding: 5px 0; font-size: 12.5px; color: #4ade80; }
  .footer { margin-top: 16px; font-size: 11px; color: #5b6072; text-align: right; }
  .footer .push-time { margin-top: 3px; }
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #262a35;
    background: #171a23;
    color: #e5e7eb;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .nav-btn:hover { background: #1f232e; border-color: #3a3f4d; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">VendEase SLA dashboard</div>
      <div class="subtitle" id="hdr-date"></div>
    </div>
    <div class="stats">
      <div class="stat alert"><div class="n" id="hdr-alerts"></div><div class="l">in alert</div></div>
      <div class="stat"><div class="n" id="hdr-machines"></div><div class="l">machines</div></div>
      <a class="nav-btn" href="https://vendeaseltd.github.io/SLADashboard/VendEase_offline.html">&#128246; Offline machines</a>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <div id="footer"></div>
    <div class="push-time" id="footer-push"></div>
  </div>
</div>

<script>
const DATA = {"date": "2026-08-14", "run_date": "2026-08-14", "run_timestamp": "2026-08-14 12:12 BST", "partners": {"Abercromby Vending": {"total": 79, "alerts": [{"serial": "SVM0000294", "partner": "Abercromby Vending", "location": "Premier Inn Falkirk East", "water_pct": 0.0, "snack_pct": 0.0, "online": "No"}, {"serial": "SVM0000296", "partner": "Abercromby Vending", "location": "Premier Inn Milngavie", "water_pct": 0.0, "snack_pct": 43.2, "online": "No"}, {"serial": "SVM0000256", "partner": "Abercromby Vending", "location": "Premier Inn Dundee East", "water_pct": 12.5, "snack_pct": 68.7, "online": "Yes"}]}, "VendEase Premier Inn": {"total": 205, "alerts": [{"serial": "IVM0006986", "partner": "VendEase Premier Inn", "location": "Premier Inn Basingstoke Town Centre", "water_pct": 100.0, "snack_pct": 14.2, "online": "Yes"}, {"serial": "SVM0000238", "partner": "VendEase Premier Inn", "location": "Premier Inn Southend On Sea (Eastern Esplanade)", "water_pct": 14.0, "snack_pct": 55.0, "online": "Yes"}, {"serial": "SVM0000355", "partner": "VendEase Premier Inn", "location": "Premier Inn Ware", "water_pct": 36.0, "snack_pct": 12.6, "online": "Yes"}, {"serial": "SVM0000218", "partner": "VendEase Premier Inn", "location": "Premier Inn Oxford Botley", "water_pct": 92.0, "snack_pct": 15.0, "online": "Yes"}, {"serial": "IVM0002025", "partner": "VendEase Premier Inn", "location": "Premier Inn Bicester", "water_pct": 90.0, "snack_pct": 14.6, "online": "Yes"}]}, "WLV": {"total": 181, "alerts": []}, "VendEase Travelodge": {"total": 31, "alerts": []}, "JW Vending": {"total": 63, "alerts": [{"serial": "SVM0000833", "partner": "JW Vending", "location": "Premier Inn Cribbs", "water_pct": 0.0, "snack_pct": 46.9, "online": "No"}, {"serial": "SVM0000857", "partner": "JW Vending", "location": "Premier Inn Taunton Ruishton", "water_pct": 0.0, "snack_pct": 57.5, "online": "No"}, {"serial": "IVM0007837", "partner": "JW Vending", "location": "Premier Inn Torquay Seafront", "water_pct": 0.0, "snack_pct": 73.2, "online": "Yes"}]}, "V4 Vending": {"total": 1, "alerts": []}, "Wilkes Vending": {"total": 22, "alerts": []}, "Bettavend": {"total": 1, "alerts": []}}, "tracking": {"IVM0006986": "2026-08-14", "SVM0000238": "2026-08-14", "SVM0000355": "2026-08-14", "SVM0000294": "2026-06-13", "SVM0000296": "2026-07-05", "SVM0000256": "2026-08-14", "SVM0000218": "2026-08-14", "IVM0002025": "2026-08-14", "SVM0000833": "2026-08-09", "SVM0000857": "2026-08-11", "IVM0007837": "2026-08-09"}, "last_github_push": "2026-08-14 12:12 BST"};
const KNOWN_ORDER = ['Abercromby Vending', 'VendEase Premier Inn', 'VendEase Travelodge', 'WLV', 'JW Vending', 'V4 Vending', 'Wilkes Vending', 'Bettavend'];
const ICONS = {
  'Abercromby Vending': '&#127970;',
  'VendEase Premier Inn': '&#128716;',
  'VendEase Travelodge': '&#128717;',
  'WLV': '&#127981;',
  'JW Vending': '&#127981;',
  'V4 Vending': '&#127981;',
  'Wilkes Vending': '&#127981;',
  'Bettavend': '&#127981;',
  'Unknown': '&#10067;'
};
const PARTNERS = [...KNOWN_ORDER, ...Object.keys(DATA.partners).filter(p => !KNOWN_ORDER.includes(p))];

// Failing partners (those with at least one active alert) are surfaced to the
// top of the dashboard, ordered chronologically by how long they've been in
// breach — the partner with the oldest still-active first_alert date (i.e.
// the longest-running, most overdue breach) appears first. Partners with no
// current alerts stay below, in their original KNOWN_ORDER.
function partnerEarliestAlertDate(p) {
  const pd = DATA.partners[p];
  if (!pd || !pd.alerts.length) return null;
  let earliest = null;
  pd.alerts.forEach(a => {
    const fa = DATA.tracking[a.serial];
    if (fa && (!earliest || new Date(fa) < new Date(earliest))) earliest = fa;
  });
  return earliest;
}
PARTNERS.sort((a, b) => {
  const ea = partnerEarliestAlertDate(a);
  const eb = partnerEarliestAlertDate(b);
  const aHas = ea !== null, bHas = eb !== null;
  if (aHas !== bHas) return aHas ? -1 : 1;
  if (aHas && bHas) return new Date(ea) - new Date(eb);
  return 0; // stable sort preserves KNOWN_ORDER among non-failing partners
});

function pillClass(pct) {
  if (pct === null || pct === undefined) return 'ok';
  if (pct <= 10) return 'danger';
  if (pct <= 24) return 'warning';
  return 'ok';
}

function pill(pct) {
  if (pct === null || pct === undefined) return '<span></span>';
  const c = pillClass(pct);
  return `<span class="pill ${c}">${pct.toFixed(0)}%</span>`;
}

function daysSince(ds) {
  const ref = new Date(DATA.run_date || DATA.date);
  return Math.max(1, Math.round((ref - new Date(ds)) / 86400000) + 1);
}

function onlinePill(online) {
  if (online === undefined || online === null) return '<span></span>';
  const isOnline = online === 'Yes' || online === true;
  return `<span class="pill ${isOnline ? 'ok' : 'danger'}">${isOnline ? 'Yes' : 'No'}</span>`;
}

const runD = new Date(DATA.run_date || DATA.date);
const runTimePart = DATA.run_timestamp ? DATA.run_timestamp.split(' ').slice(1).join(' ') : '';
document.getElementById('hdr-date').textContent = runD.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (runTimePart ? ' · ' + runTimePart : '') + (DATA.data_note ? ' — ⚠️ ' + DATA.data_note : '');

let totalAlerts = 0, totalMachines = 0;
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  totalMachines += pd.total || 0;
  totalAlerts += pd.alerts.length;
});
document.getElementById('hdr-alerts').textContent = totalAlerts;
document.getElementById('hdr-machines').textContent = totalMachines;

let html = '';
PARTNERS.forEach(p => {
  const pd = DATA.partners[p];
  if (!pd) return;
  const alerts = pd.alerts;
  const hasAlerts = alerts.length > 0;
  const icon = ICONS[p] || '&#127970;';
  html += `<div class="card ${hasAlerts ? 'has-alerts' : ''}">
    <div class="card-head">
      <span class="name"><span>${icon}</span>${p}</span>
      <span class="badge ${hasAlerts ? 'bad' : 'ok'}">${alerts.length}/${pd.total}</span>
    </div>`;
  if (!hasAlerts) {
    html += `<div class="all-clear">&#10003; All clear</div>`;
  } else {
    html += `<div class="col-head"><span>Location</span><span>Water</span><span>Snack</span><span>Days</span><span>Online</span></div>`;
    const sortedAlerts = alerts.slice().sort((a, b) => {
      const aOffline = a.online === 'No' ? 0 : 1;
      const bOffline = b.online === 'No' ? 0 : 1;
      if (aOffline !== bOffline) return aOffline - bOffline;
      const aMin = Math.min(a.water_pct ?? Infinity, a.snack_pct ?? Infinity);
      const bMin = Math.min(b.water_pct ?? Infinity, b.snack_pct ?? Infinity);
      return aMin - bMin;
    });
    sortedAlerts.forEach(a => {
      const days = DATA.tracking[a.serial] ? daysSince(DATA.tracking[a.serial]) : 1;
      const dayTag = days > 1 ? `<span class="pill ok">${days}d</span>` : '<span></span>';
      html += `<div class="row">
        <span class="loc">${a.location}<span class="serial">${a.serial}</span></span>
        ${pill(a.water_pct)}
        ${pill(a.snack_pct)}
        ${dayTag}
        ${onlinePill(a.online)}
      </div>`;
    });
  }
  html += `</div>`;
});
document.getElementById('grid').innerHTML = html;
document.getElementById('footer').textContent = 'Water = Radnor/Strathmore stock · Snacks = chocolate/crisps/bars stock · Alert threshold 15%';
document.getElementById('footer-push').textContent = DATA.last_github_push
  ? 'Last uploaded to GitHub: ' + DATA.last_github_push
  : 'Last uploaded to GitHub: not yet recorded';

// Departure-board style auto-paging: jump down one screen, hold, jump to the
// next, and loop back to the top once the bottom is reached. Only runs when
// the page is actually taller than the viewport (i.e. once partner cards
// overflow one screen) - on a single screen's worth of content it does nothing.
(function () {
  const HOLD_MS = 6000; // time to hold at each screen before jumping
  let timer = null;

  function maxScroll() {
    return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }

  function hasOverflow() {
    return maxScroll() > 20;
  }

  function jumpToNextScreen() {
    if (!hasOverflow()) return;
    const max = maxScroll();
    const next = window.scrollY + window.innerHeight;
    window.scrollTo(0, next >= max - 5 ? 0 : next);
  }

  function restart() {
    if (timer) clearInterval(timer);
    timer = hasOverflow() ? setInterval(jumpToNextScreen, HOLD_MS) : null;
  }

  window.addEventListener('load', restart);
  window.addEventListener('resize', restart);
})();
</script>
</body>
</html>
